---
- name: Configure and automate infrastructure
  hosts: local
  become: yes

  tasks:
    - name: Update package cache
      apt:
        update_cache: yes

    - name: Install required packages
      apt:
        name:
          - nginx
          - curl
          - git
        state: present

    - name: Ensure Nginx is running
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Create application directory
      file:
        path: /var/www/devops-app
        state: directory
        mode: '0755'

    - name: Deploy sample application
      copy:
        dest: /var/www/devops-app/index.html
        content: |
          <!DOCTYPE html>
          <html>
          <head>
            <title>DevOps Lab 3</title>
          </head>
          <body>
            <h1>DevOps Lab 3 - Ansible Automation</h1>
            <p>Application successfully deployed using Ansible.</p>
          </body>
          </html>

    - name: Configure Nginx application
      copy:
        dest: /etc/nginx/sites-available/devops-app
        content: |
          server {
              listen 8081;
              server_name localhost;
              root /var/www/devops-app;
              index index.html;
          }

    - name: Enable application site
      file:
        src: /etc/nginx/sites-available/devops-app
        dest: /etc/nginx/sites-enabled/devops-app
        state: link

    - name: Restart Nginx
      service:
        name: nginx
        state: restarted
