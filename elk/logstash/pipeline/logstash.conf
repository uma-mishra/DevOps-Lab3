input {
  tcp {
    port => 8080
    codec => json
  }
}

filter {
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }

  mutate {
    add_field => {
      "environment" => "lab"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "devops-logs-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}
